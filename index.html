<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>defgodqe — Your AI. Your Ideas. Your World.</title>
  <meta name="description" content="defgodqe — an advanced AI assistant for chatting, coding, creativity, gaming, images and more. Think Bigger. Create Anything." />
  <meta name="theme-color" content="#facc15" />

  <script>
    window.onerror = function (msg, src, line, col, err) {
      try { window.parent.postMessage({ type: "app-error", message: msg, source: src, lineno: line, colno: col, stack: (err && err.stack) || "" }, "*"); } catch (_) {}
    };
    window.onunhandledrejection = function (e) {
      try { window.parent.postMessage({ type: "app-error", message: "Unhandled promise rejection: " + ((e.reason && e.reason.message) || e.reason || "unknown"), stack: (e.reason && e.reason.stack) || "" }, "*"); } catch (_) {}
    };
    window.addEventListener("error", function (e) {
      var target = e && e.target;
      if (target && target !== window && target.tagName === "SCRIPT") {
        try { window.parent.postMessage({ type: "app-error", message: "Failed to load script: " + (target.src || "(inline)"), source: target.src || "" }, "*"); } catch (_) {}
      }
    }, true);
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: { ink: "#0a0d14", panel: "#0f131c", card: "#151b26", brand: "#facc15" },
        fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] }
      }}
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="defgodqe" />
</head>

<body class="h-full bg-ink text-slate-200 font-sans antialiased overflow-hidden">
  <!-- The existing defgodqe UI is kept here. Feature scripts attach to these IDs. -->
  <div class="flex h-screen w-screen overflow-hidden">
    <aside id="sidebar" class="sidebar fixed lg:static z-40 flex h-full w-[280px] shrink-0 flex-col border-r border-white/5 bg-panel">
      <div class="flex items-center gap-2.5 px-4 py-4">
        <div class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-xl bg-brand/10">
          <img src="https://raw.githubusercontent.com/defgodqe-arch/defgodqe-ai/main/Screenshot_2026-02-27_164030.png" alt="defgodqe logo" class="h-full w-full object-cover" />
        </div>
        <div class="leading-tight">
          <div class="text-sm font-extrabold tracking-tight text-white">defgodqe</div>
          <div class="text-[10px] text-slate-500">Think Bigger. Create Anything.</div>
        </div>
        <button id="closeSidebar" class="ml-auto text-slate-500 hover:text-white lg:hidden" type="button" aria-label="Close sidebar">×</button>
      </div>
      <div class="px-3">
        <button id="newChatBtn" type="button" class="flex w-full items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-medium text-white transition hover:bg-white/10">＋ New chat</button>
      </div>
      <div class="mt-4 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-600">Chats</div>
      <div id="chatList" class="mt-1 flex-1 space-y-0.5 overflow-y-auto px-2 pb-4"></div>
      <div class="border-t border-white/5 p-3">
        <div id="authRow" class="flex items-center gap-2.5 rounded-xl px-2 py-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-brand/15 text-brand">●</div>
          <div class="min-w-0 flex-1"><div id="userName" class="truncate text-sm font-medium text-slate-200">Guest</div><div class="text-[10px] text-slate-500">Free forever</div></div>
          <button id="signBtn" type="button" class="rounded-lg bg-white/5 px-2.5 py-1.5 text-xs font-medium text-slate-200 transition hover:bg-white/10">Sign in</button>
        </div>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="fixed inset-0 z-30 hidden bg-black/50 lg:hidden"></div>

    <main class="flex h-full min-w-0 flex-1 flex-col">
      <header class="flex items-center gap-3 border-b border-white/5 px-4 py-3">
        <button id="openSidebar" type="button" class="text-slate-400 hover:text-white lg:hidden" aria-label="Open sidebar">☰</button>
        <div class="relative">
          <button id="modelBtn" type="button" class="flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-sm font-semibold text-white transition hover:bg-white/5"><span id="modelLabel">defgodqe AI</span>⌄</button>
          <div id="modelMenu" class="absolute left-0 top-full z-20 mt-1 hidden w-64 rounded-xl border border-white/10 bg-card p-1.5 shadow-xl"></div>
        </div>
        <div class="relative ml-1">
          <button id="modeBtn" type="button" class="flex items-center gap-1.5 rounded-lg border border-white/10 px-2.5 py-1.5 text-xs font-medium text-slate-300 transition hover:bg-white/5"><span id="modeLabel">Normal</span>⌄</button>
          <div id="modeMenu" class="absolute left-0 top-full z-20 mt-1 hidden w-56 rounded-xl border border-white/10 bg-card p-1.5 shadow-xl"></div>
        </div>
        <div class="ml-auto flex items-center gap-1">
          <button id="webBtn" type="button" title="Toggle web search" aria-label="Toggle web search" aria-pressed="false" class="flex items-center gap-1.5 rounded-lg border border-white/10 px-2.5 py-1.5 text-xs font-medium text-slate-400 transition hover:bg-white/5">🌐 <span class="hidden sm:inline">Web</span></button>
          <button id="voiceBtn" type="button" title="Voice mode" aria-label="Voice mode" class="flex items-center gap-1.5 rounded-lg border border-brand/40 bg-brand/10 px-2.5 py-1.5 text-xs font-medium text-brand transition hover:bg-brand/20">🎙 <span class="hidden sm:inline">Voice</span></button>
        </div>
      </header>

      <div id="scroll" class="relative flex-1 overflow-y-auto">
        <div id="welcome" class="mx-auto flex h-full max-w-3xl flex-col items-center justify-center px-6 text-center">
          <div class="orb mb-6" aria-hidden="true"><span></span></div>
          <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">Hey, I'm <span class="text-brand">defgodqe</span></h1>
          <p class="mt-2 max-w-md text-slate-400">Your AI. Your Ideas. Your World.</p>
        </div>
        <div id="messages" class="mx-auto hidden w-full max-w-3xl px-4 py-6"></div>
      </div>

      <form id="composer" class="border-t border-white/5 p-4">
        <div class="mx-auto flex max-w-3xl gap-2 rounded-2xl border border-white/10 bg-white/5 p-2">
          <input id="prompt" autocomplete="off" class="min-w-0 flex-1 bg-transparent px-3 py-2 text-sm text-white outline-none" placeholder="Message defgodqe…" />
          <button id="sendBtn" type="submit" class="rounded-xl bg-brand px-4 py-2 text-sm font-bold text-black">Send</button>
        </div>
      </form>
    </main>
  </div>

  <input id="fileInput" type="file" class="hidden" multiple accept="image/*,.txt,.md,.json,.csv,.js,.py,.html,.css,.pdf" />
  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-xl border border-white/10 bg-card px-4 py-2 text-sm text-white opacity-0 transition-all" role="status" aria-live="polite"></div>

  <!-- These are intentionally classic scripts. Vite should not send this legacy JS through Rollup. -->
  <script src="branding.js"></script>
  <script src="opening-animation.js"></script>
  <script src="features.js"></script>
  <script src="app.js"></script>
  <script src="voice-upgrade.js"></script>
</body>
</html>
