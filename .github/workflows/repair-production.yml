name: Repair defgodqe production assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local Tailwind CSS
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false tailwindcss@3.4.17
          cat > tailwind.config.cjs <<'EOF'
          module.exports = {
            content: [
              './index.html',
              './*.js',
              './src/**/*.{js,ts,jsx,tsx}'
            ],
            darkMode: 'class',
            theme: {
              extend: {
                colors: {
                  ink: '#0a0d14',
                  panel: '#0f131c',
                  card: '#151b26',
                  brand: '#facc15'
                },
                fontFamily: {
                  sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                }
              }
            },
            plugins: []
          };
          EOF
          cat > tailwind.input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          npx tailwindcss -c tailwind.config.cjs -i ./tailwind.input.css -o ./generated-tailwind.css --minify
          rm -f tailwind.input.css

      - name: Remove production Tailwind CDN and fix icons
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('  <script src="https://cdn.tailwindcss.com"></script>')
          if start != -1:
              end = s.find('  <!-- ============================================================\n       MARKDOWN', start)
              if end == -1:
                  raise SystemExit('Tailwind block boundary not found')
              s = s[:start] + '  <link rel="stylesheet" href="generated-tailwind.css" />\n\n' + s[end:]
          s = s.replace('href="icons/icon-192.png"', 'href="icons/icon-192.svg"')
          s = s.replace('href="icons/apple-touch-icon-180.png"', 'href="icons/icon-192.svg"')
          p.write_text(s, encoding='utf-8')

      - name: Repair legacy CSS wrapper
        shell: python
        run: |
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          if s.startswith('```css'):
              s = s[6:]
              if s.startswith('\n'):
                  s = s[1:]
          if s.rstrip().endswith('```'):
              s = s.rstrip()[:-3].rstrip() + '\n'
          p.write_text(s, encoding='utf-8')

      - name: Add legacy core compatibility module
        shell: bash
        run: |
          cat > app-core.js <<'EOF'
          /* defgodqe legacy compatibility entry.
           * Older production shells requested /app-core.js. Keep that URL valid
           * while the current Vite entry is app.js.
           */
          import './app.js';
          EOF

      - name: Remove obsolete logo workflow
        shell: bash
        run: rm -f .github/workflows/fix-brand-logo.yml

      - name: Commit repaired production assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css generated-tailwind.css tailwind.config.cjs app-core.js .github/workflows/fix-brand-logo.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair production assets and legacy script loading"
          git push
