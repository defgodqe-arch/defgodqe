name: Install defgodqe startup animation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, 'Install startup animation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add startup script before app.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          script='<script src="opening-animation.js"></script>\n\n  <script\n    type="module"\n    src="app.js"\n  ></script>'
          old='<script\n    type="module"\n    src="app.js"\n  ></script>'
          if 'opening-animation.js' not in s:
              if old not in s:
                  raise SystemExit('app.js script tag not found')
              s=s.replace(old,script,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit startup animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install startup animation'
          git push
