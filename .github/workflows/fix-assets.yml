name: Fix defgodqe frontend assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Apply frontend asset fixes')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove only the accidental literal "html" line.
          if s.startswith('html\n'):
              s = s[5:]

          old = 'assets/Screenshot_2026-02-27_164030.png'
          new = 'https://raw.githubusercontent.com/defgodqe-arch/defgodqe-ai/main/Screenshot_2026-02-27_164030.png'
          if old in s:
              s = s.replace(old, new)

          mobile = '<link rel="stylesheet" href="mobile.css">'
          if mobile not in s:
              marker = '<link\n    rel="stylesheet"\n    href="styles.css"\n  />'
              if marker in s:
                  s = s.replace(marker, marker + '\n\n  ' + mobile, 1)

          branding = '<script src="branding.js"></script>'
          if branding not in s:
              marker = '<script\n    type="module"\n    src="app.js"\n  ></script>'
              if marker in s:
                  s = s.replace(marker, branding + '\n\n  ' + marker, 1)

          features = '<script src="features.js"></script>'
          if features not in s:
              marker = '<script\n    type="module"\n    src="app.js"\n  ></script>'
              if marker in s:
                  s = s.replace(marker, features + '\n\n  ' + marker, 1)

          voice = '<script src="voice-upgrade.js"></script>'
          if voice not in s:
              marker = '<script\n    type="module"\n    src="app.js"\n  ></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n\n  ' + voice, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Apply frontend asset fixes'
          git push
